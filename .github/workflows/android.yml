
name: Build SAMP Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SAMP Mobile
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SAMP-Mobile source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Verify source files
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la

          test -f gradlew || {
            echo "ERROR: gradlew not found at repository root"
            exit 1
          }

          test -f settings.gradle || {
            echo "ERROR: settings.gradle not found"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

          test -f app/src/main/cpp/CMakeLists.txt || {
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          }

          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
